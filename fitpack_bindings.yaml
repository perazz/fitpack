# FITPACK binding generation configuration
#
# Drives the fortran-arrays binding generator to produce every C/C++ interface
# in src/capi/ and include/. Regenerate with:
#
#   ./scripts/generate_bindings.sh [--verbose]
#
# NEVER hand-edit a generated file: change the Fortran source or this config
# and re-run the script. The only hand-written pieces of the interface are
# src/capi/fitpack_core_c.f90, include/fitpack_core_c.h, include/fpPoint.hpp and
# the ergonomic snippets under extra_methods/ (spliced into the generated headers).
#
# FITPACK kind parameters (defined in fitpack_core.F90):
#   integer, parameter :: FP_REAL = c_double
#   integer, parameter :: FP_SIZE = c_int32_t
#   integer, parameter :: FP_FLAG = c_int32_t
#   integer, parameter :: FP_BOOL = c_bool
#   integer, parameter :: FP_COMM = c_double
#   integer, parameter :: FP_DIM  = c_int32_t

project_name: FITPACK
project_description: "Modern Fortran Fitting Package — C/C++ Bindings"
author: "Federico Perini"

# Project-branded status struct: the generated C declarations name fp_status, and
# the standalone headers define it as a layout-identical alias of fortran-arrays'
# fx_status, so a gated build and a bare one share one ABI.
status_type: fp_status

# House file-header banner (the FITPACK logo block) in place of the generator's
# built-in box. One fragment serves C and C++ — same /* ... */ form, and the
# identity line follows whichever of cpp_class/module_name the file has.
header_template:
  fortran: bindings_templates/banner.f90.jinja2
  c:       bindings_templates/banner.h.jinja2
  cpp:     bindings_templates/banner.h.jinja2

# Standalone headers, with the fxArray views behind a build gate so the very
# same headers compile with and without fortran-arrays on the include path.
# This repository never depends on fortran-arrays; a consumer that has it
# (e.g. FRESCO) gets the zero-copy views for free from the same sources.
standalone: "gated"

kind_aliases:
  real:
    FP_REAL: c_double
    FP_COMM: c_double
  integer:
    FP_SIZE: c_int32_t
    FP_FLAG: c_int32_t
    FP_DIM: c_int32_t
  logical:
    FP_BOOL: c_bool

source_root: ./src
fortran_dir: ./src/capi
c_dir: ./include
cpp_dir: ./include

bindings:
  # --- Abstract base fitter ---
  - module: fitpack_fitters
    type: fitpack_fitter
    abstract: true
    cpp_classes:
      fitpack_fitter: fpFitter
    fortran_source: fitpack_fitters.f90

  # --- Univariate curves ---
  - module: fitpack_curves
    types: [fitpack_curve, fitpack_periodic_curve]
    cpp_classes:
      fitpack_curve: fpCurve
      fitpack_periodic_curve: fpPeriodicCurve
    fortran_source: fitpack_curves.f90
    extra_methods:
      fpCurve:
        - includes: ['"fpPoint.hpp"']
          file: fpCurveErgonomics.hpp
      fpPeriodicCurve:
        - file: fpCurveInherit.hpp

  # --- Parametric curves ---
  - module: fitpack_parametric_curves
    types: [fitpack_parametric_curve, fitpack_closed_curve, fitpack_constrained_curve]
    cpp_classes:
      fitpack_parametric_curve: fpParametricCurve
      fitpack_closed_curve: fpClosedCurve
      fitpack_constrained_curve: fpConstrainedCurve
    fortran_source: fitpack_parametric.f90
    extra_methods:
      fpParametricCurve:
        - includes: ['"fpPoint.hpp"']
          file: fpParametricPoints.hpp
      fpClosedCurve:
        - file: fpParametricInherit.hpp
      fpConstrainedCurve:
        - file: fpParametricInherit.hpp
        - file: fpConstrainedPoints.hpp

  # --- Constrained univariate curves ---
  - module: fitpack_convex_curves
    type: fitpack_convex_curve
    cpp_classes:
      fitpack_convex_curve: fpConvexCurve
    fortran_source: fitpack_convex_curves.f90

  # --- Bivariate surfaces (scattered) ---
  - module: fitpack_surfaces
    type: fitpack_surface
    cpp_classes:
      fitpack_surface: fpSurface
    fortran_source: fitpack_surfaces.f90

  # --- Bivariate surfaces (gridded) ---
  - module: fitpack_gridded_surfaces
    type: fitpack_grid_surface
    cpp_classes:
      fitpack_grid_surface: fpGridSurface
    fortran_source: fitpack_gridded_surfaces.f90

  # --- N-dimensional gridded splines (the d-D generalization of fpGridSurface) ---
  - module: fitpack_gridded_splines
    type: fitpack_gridded_spline
    cpp_classes:
      fitpack_gridded_spline: fpGridSpline
    fortran_source: fitpack_gridded_splines.f90
    extra_methods:
      fpGridSpline:
        - includes: ['"fpPoint.hpp"']
          file: fpGridSplinePoints.hpp

  # --- Parametric surfaces ---
  - module: fitpack_parametric_surfaces
    type: fitpack_parametric_surface
    cpp_classes:
      fitpack_parametric_surface: fpParametricSurface
    fortran_source: fitpack_parametric_surfaces.f90

  # --- Polar domain surfaces ---
  - module: fitpack_polar_domains
    type: fitpack_polar
    cpp_classes:
      fitpack_polar: fpPolar
    fortran_source: fitpack_polar.f90

  - module: fitpack_gridded_polar
    type: fitpack_grid_polar
    cpp_classes:
      fitpack_grid_polar: fpGridPolar
    fortran_source: fitpack_gridded_polar.f90

  # --- Spherical domain surfaces ---
  - module: fitpack_sphere_domains
    type: fitpack_sphere
    cpp_classes:
      fitpack_sphere: fpSphere
    fortran_source: fitpack_spheres.f90

  - module: fitpack_gridded_sphere
    type: fitpack_grid_sphere
    cpp_classes:
      fitpack_grid_sphere: fpGridSphere
    fortran_source: fitpack_gridded_sphere.f90
